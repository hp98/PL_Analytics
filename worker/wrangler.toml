name = "one-stop-fpl-worker"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# Local dev needs no Cloudflare account: `npm run dev` runs the Worker on
# http://localhost:8787 (miniflare) and makes real outbound calls to the FPL API.
#
# To DEPLOY (requires your Cloudflare account — run `wrangler login` first):
#   - `wrangler deploy`
#   - Then bind it to the Pages app so the frontend can call it same-origin at
#     /api/*, e.g. add a route in the Pages project or a custom domain here:
#
# [[routes]]
# pattern = "app.example.com/api/*"
# zone_name = "example.com"

[observability]
enabled = true
