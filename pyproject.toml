[project]
name = "one-stop-fpl"
version = "0.1.0"
description = "One-Stop FPL — data pipeline, projection model, and optimiser"
readme = "README.md"
requires-python = ">=3.12"

# Core dependencies needed for M1 (ingest + transform orchestration).
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.5",
    "polars>=1.5",
    "duckdb>=1.1",
    "pyyaml>=6.0",
    "structlog>=24.1",
]

[project.optional-dependencies]
# Transform layer (dbt on DuckDB). Kept separate so M1 ingest can run without
# resolving the heavier dbt dependency tree if desired.
transform = [
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
]
# Modelling stack (M4). Not needed for M1-M3.
model = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
]
# Optimiser (M6).
optimise = [
    "pulp>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
]

[tool.uv]
# Install the transform extra by default in the dev environment so `dbt` is
# available after `uv sync --extra transform`.
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # PuLP 3.x pre-announces 4.0 API changes; we use the stable 3.x API.
    "ignore:.*PULP_CBC_CMD is deprecated.*:DeprecationWarning",
    "ignore:.*LpVariable.dicts is deprecated.*:DeprecationWarning",
]
